defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, learning_rate_monitor]
  - /data: spotify
  - /model: small
  - /strategy: ddp
  - /noise: loglinear
  - /lr_scheduler: constant_warmup

mode: train  # train / ppl_eval / sample_eval / rec_eval
diffusion: absorbing_state
backbone: dit  # dit / dimamba / ar
parameterization: subs  # subs / d3pm / sedd
time_conditioning: True
T: 0  # 0 (continuous time) / 1000 
subs_masking: False

seed: 1

loader:
  global_batch_size: 512
  eval_global_batch_size: ${.global_batch_size}
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  predictor: ddpm_cache  # analytic, ddpm, ddpm_cache
  steps: 256
  noise_removal: True
  # TODO(yair): @subham, why aren't these params under `eval`?
  num_sample_batches: 2  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 2
  # Legacy unconditional sample_eval controls. WP-C evaluation uses explicit
  # joint full-mask completion and ignores these three fields.
  semi_ar: False
  stride_length: 15
  num_strides: 1
  cfg_enabled: false  # true = CFG prefix token conditioning（需重新训练）
  cfg_encoder: false  # true = 用 Transformer encoder 编码 context（false = mean-pool）
  cfg_p_drop: 0.1     # 训练时 context dropout 概率
  cfg_w: 2.0          # 推理 guidance scale（1.0=仅 conditioned，>1=放大）
  structure_conditioning: false  # retained only for legacy-checkpoint compatibility

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False
  # Log the pre-clipping gradient norm, the clipping indicator, and embedding
  # gradient norms every log_every_n_steps (training-schedule ablation).
  # Logging only; it does not change training.
  log_grad_norm: false
  # RVQ 层级 loss 权重配置
  # Token 结构：[BOS, BOI, d0, d1, d2, conflict, c0, ..., c7, BOI, ...]
  # Layer 0 (d0) 决定粗粒度类别，最重要；conflict digit 很少被真正使用，权重最低
  # rvq_weights: 各 RVQ 层的权重列表 [d0, d1, d2, ...]，若长度不足则用最后一个值补充
  # conflict_weight: conflict digit 的权重
  # 开启 normalize 后，位置权重会归一化到 target token 平均权重为 1，
  # 因而 curriculum 不会改变总 loss 尺度或等效学习率。
  layer_loss_weights:
    enabled: true
    normalize: true
    rvq_weights: [2.0, 1.5, 1.0]
    conflict_weight: 0.5
    cue_weight: 1.0
    # Full GenPlaylist uses this curriculum. Set enabled=false for the uniform-loss ablation.
    # 前 1000 steps
    # 固定使用 initial_*，随后在 1000--5000 steps 线性插值到上面的最终值。
    warmup:
      enabled: true
      start_step: 1000
      end_step: 5000
      initial_rvq_weights: [2.0, 1.5, 1.0]
      initial_conflict_weight: 0.5
      initial_cue_weight: 0.1

eval:
  checkpoint_path: ''  # Used to evaluate a checkpoint after training.
  # rec_eval always writes a versioned JSON result. Null means the Hydra run
  # directory's rec_eval_results.json; the official runner supplies an absolute path.
  results_path: null
  git_commit: null
  # False for official metrics. True is recorded for explicitly named smoke or
  # speed-ablation runs that override seed, EMA, or reverse-diffusion steps.
  allow_protocol_override: false
  # True only for diagnostics that evaluate a checkpoint on test contexts of a
  # different history_condition (e.g. Full on shuffled_cue); marked unofficial.
  allow_history_condition_mismatch: false
  # Training-curve points only: evaluate a fixed random subset of this many
  # test histories (null = all). Requires allow_protocol_override; the subset
  # is drawn once from test_subset_seed and is identical across checkpoints.
  max_test_examples: null
  test_subset_seed: 0
  # Model study A: keep only the most recent k of the 15 references and blank
  # the older ones with the null tokens (null = keep all). Results with k < 15
  # are marked official_protocol=false. See docs/model_study.md.
  history_length: null
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True
  # WP-C evaluates one jointly generated five-item continuation.
  predict_num_items: 5

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 0
  max_steps: 20000
  log_every_n_steps: 10
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 0.0     # no validation split; evaluate unified test after training
  val_check_interval: 1.0     # inert while limit_val_batches=0; supports short smoke epochs

wandb: null  # 已禁用，使用 TensorBoard 替代（bash scripts/start_tensorboard.sh）

# TensorBoard 配置 - 本地实时可视化
use_tensorboard: true

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
  # Optional one-time initialization from the official spotify30 checkpoint.
  # This starts a fresh optimizer/step history and semantically remaps the old
  # 1028-token vocabulary to GenPlaylist's 2894-token runtime vocabulary.
  warmstart_path: null

evaluator:
  dataset: spotify
  feature_type: clhe
  sent_emb_pca: -1
  cir: 1
  topk: [1] #3,5,10,20
  metrics: [recall,precision,hit,hitf,sm]
  sm_topk: 1  # K for SM@K per-position retrieval check
  # 候选集配置（用于rec_eval模式的item检索）
  candidate_multiplier: 99  # 候选集大小 = label_items数量 × multiplier（默认99，总共100倍）
  allow_duplicate_items: false  # 是否允许预测重复item（false=bundle模式，true=sequence模式） 
  num_samples: ${protocol.eval_num_samples}
  generated_items: ${protocol.eval_generated_items}

dataset: spotify
# Canonical data/dataset is resolved from the repository root when null.  Set
# this only when the frozen dataset has intentionally been relocated.
data_root: null
catalog_embeddings_path: null
item_id_to_row_path: null
semantic_tokens_path: null
codebook_weights_path: null
item2cues_path: null
cue_vocab_path: null
cue_manifest_path: null
# Optional offline cache produced by scripts/prepare_wp_c_data.py.
prepared_dataset_path: null
# WP-B stores 16 ranked candidates per song. The main model consumes the first
# 8; 0/4/16 are separate layouts and require separately prepared data and training.
active_cue_tokens: 8
# Conditioning-channel ablation of the 15 reference items (targets are never
# changed): full / latent_only / cue_only / shuffled_cue. Each value needs a
# prepared dataset built with the same --history-condition. See
# docs/ABLATIONS.md.
history_condition: full
feature_type: clhe
sent_emb_pca: -1
# Training windows contain exactly 15 references plus five continuation targets.
seq_len: 20
cir: 1
swap_ratio: 0.0

protocol:
  min_reference_items: 15
  train_target_items: 5
  eval_total_items: 20
  eval_reference_items: 15
  eval_target_items: 5
  eval_num_samples: 1
  eval_generated_items: 5

num_proc: 1
eval_batch_size: 32
train_batch_size: 64

rq_faiss: True
faiss_omp_num_threads: 32
rq_n_codebooks: 3
rq_codebook_size: 256
